name: MasterDragonPlugin
version: '${plugin.version}'
main: com.masterdragon.MasterDragonPlugin
api-version: '${api.version}'
author: Master Dragon
description: Dragon artifact roulette and collectible rewards.
commands:
  masterdragon:
    description: Master Dragon artifact commands.
    usage: /masterdragon <spin|give|reload>
    aliases: [md]
  mdspin:
    description: Start your Master Dragon artifact spin.
    usage: /mdspin
permissions:
  masterdragon.admin:
    description: Allows administering Master Dragon artifact spins.
    default: op
