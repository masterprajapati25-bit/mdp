
name: Build Master Dragon Plugin

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build Plugin
        run: mvn -Ppaper-26.2 clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: MasterDragonPlugin-26.2
          path: target/*.jar
